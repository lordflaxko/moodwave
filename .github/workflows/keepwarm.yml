name: Keep API warm

# Render's free plan sleeps a service after ~15 minutes without traffic, and waking it
# takes up to a minute. A light ping keeps the first visit fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://moodwave-api.onrender.com/health
