# One-command local stack: docker compose up --build
# Then open http://127.0.0.1:3000 (runs in demo mode until keys are added to apps/api/.env).
services:
  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/moodwave.db
      FRONTEND_URL: http://127.0.0.1:3000
    volumes:
      - moodwave-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  moodwave-data:
