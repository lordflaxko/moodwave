[project]
name = "moodwave-api"
version = "1.0.0"
description = "Moodwave AI playlist generator: FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=1.0",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
